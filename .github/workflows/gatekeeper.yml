name: LLM Infrastructure Gatekeeper

on:
  pull_request:
    branches: [ main ]

jobs:
  profile-infrastructure:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Generate Simulation Matrix
        id: sim_matrix
        run: |
          chmod +x twin.py
          # Run matrix command pointing to the root configs folder
          REPORT=$(python3 twin.py matrix configs/)
          
          # Safely handle multi-line outputs for GitHub Actions environment variables
          echo "REPORT<<EOF" >> $GITHUB_ENV
          echo "$REPORT" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - name: Post Simulation Report to Pull Request
        uses: mshick/add-pr-comment@v2
        with:
          message: |
            ${{ env.REPORT }}
